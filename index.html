<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f3ee">
    <meta name="description" content="Hearth is a Pomodoro focus timer with a task list saved on this device.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23dc2626'/%3E%3C/svg%3E">
    <title>Hearth — Focus timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="page">
      <header class="topbar">
        <p class="brand">Hearth</p>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark mode">
          <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round"></path>
          </svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.75"></circle>
            <path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M18.4 5.6l-1.6 1.6M7.2 16.8l-1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"></path>
          </svg>
          <span class="theme-label">Dark</span>
        </button>
      </header>

      <main id="main">
        <section class="timer-panel" data-phase="focus" aria-labelledby="phase-label">
          <p id="timer-status" class="eyebrow">Ready</p>
          <h1 id="phase-label">Focus</h1>
          <p id="timer-display" class="time" role="timer">25:00</p>
          <div
            id="progress"
            class="progress"
            role="progressbar"
            aria-label="Time remaining"
            aria-valuemin="0"
            aria-valuemax="1500"
            aria-valuenow="1500"
            aria-valuetext="25:00 remaining"
          >
            <span id="progress-fill" class="progress-fill"></span>
          </div>
          <div class="controls">
            <button id="start" class="button button-primary" type="button">Start</button>
            <button id="pause" class="button" type="button" disabled>Pause</button>
            <button id="reset" class="button" type="button">Reset</button>
          </div>
          <div class="phases" role="group" aria-label="Session type">
            <button id="phase-focus" class="phase" type="button" aria-pressed="true">25 min focus</button>
            <button id="phase-break" class="phase" type="button" aria-pressed="false">5 min break</button>
          </div>
          <p id="session-note" class="note" role="status"></p>
        </section>

        <section class="tasks-panel" aria-labelledby="tasks-heading">
          <div class="section-copy">
            <h2 id="tasks-heading">Tasks</h2>
            <p class="lede">Select a task. Finished focus sessions count on it.</p>
          </div>
          <form id="task-form" class="task-form">
            <label class="field-label" for="task-title">New task</label>
            <div class="task-entry">
              <input id="task-title" name="title" type="text" maxlength="120" autocomplete="off" required>
              <button class="button button-primary" type="submit">Add</button>
            </div>
            <p id="task-error" class="error" role="alert"></p>
          </form>
          <p id="empty-tasks" class="empty">No tasks yet. Add one, then select it before you start.</p>
          <ul id="task-list" class="task-list"></ul>
        </section>
      </main>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
